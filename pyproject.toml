[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-document-intelligence-system"
version = "0.1.0"
description = "Financial Document Intelligence System (FDIS) — production-style RAG for financial documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Document parsing
    "pypdf>=4.0",
    # Embeddings (local, no API key)
    "sentence-transformers>=3.0",
    # Vector store
    "faiss-cpu>=1.8",
    # LLM (Groq API)
    "groq>=0.9",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # Config and utilities
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "tenacity>=8.3",
    # Sparse retrieval (BM25 + RRF hybrid)
    "rank-bm25>=0.2",
    # HTTP client
    "httpx>=0.27",
]

[project.optional-dependencies]
supabase = [
    "supabase>=2.0",
]
eval = [
    "ragas>=0.1",
    "datasets>=2.19",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",  # for FastAPI TestClient
]

[project.scripts]
fdis = "financial_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# --- Ruff (linter + formatter) ---
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["financial_rag"]

# --- Mypy (type checker) ---
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short -W ignore::DeprecationWarning"

# --- Coverage ---
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/ui/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
